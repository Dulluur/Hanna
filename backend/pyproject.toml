[project]
name = "hanna-backend"
version = "0.1.0"
description = "Hanna - backend (FastAPI + SQLAlchemy + PostgreSQL)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pydantic-settings>=2.3",
  "sqladmin>=0.18",
  "passlib[bcrypt]>=1.7",
  "itsdangerous>=2.2",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "email-validator>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
# Голые async def-тесты запускаются без @pytest.mark.asyncio на каждом.
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
